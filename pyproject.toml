[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jqpm"
dynamic = ["version"]
description = "A minimal package manager for jq"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Ceriani" }]
requires-python = ">=3.8"
keywords = ["jq", "package-manager", "json"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/miguel76/jqpm"
Issues = "https://github.com/miguel76/jqpm/issues"

[project.scripts]
jqpm = "jqpm:main"

[tool.setuptools]
py-modules = ["jqpm"]

[tool.setuptools.dynamic]
version = { attr = "jqpm.__version__" }
