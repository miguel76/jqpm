name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and newest Python versions. setup-python has no
        # Python 3.9 (end of life since October 2025) for the newer runner
        # images, so that job runs on the newest image that still has it.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.x"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest
